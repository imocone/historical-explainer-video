name: Checks

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install media inspection tools
        run: brew install ffmpeg imagemagick uv
      - name: Install through the project setup entry
        run: npm run setup
      - name: Check declared packages and resources
        run: node engine/cli.mjs check
      - name: Check paths, configuration and image authorization
        run: node --test engine/path-safety.test.mjs engine/runtime/video-settings.test.mjs packages/runtime-config.test.mjs packages/image-provenance.test.mjs packages/authored-images.test.mjs packages/modules/synthesize-narration/minimax.test.mjs packages/modules/author-narration/scripts/find-evidence.test.mjs packages/modules/render-video/runtime/hyperframes.test.mjs packages/modules/render-video/runtime/cleanup.test.mjs
