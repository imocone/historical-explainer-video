{
  "kind": "template",
  "id": "vox-explainer",
  "catalog": {
    "displayName": {
      "en": "Vox Explainer",
      "zh": "Vox讲解模板"
    },
    "purpose": "承接以解释关系、结构、空间、数量比较或运作过程为主要观看任务，且共同组织、对照或演示能带来具体、显著观看收益的连续内容；选择与段界由direct-episode的正文划段方法判断。以Vox视觉思路，用代码编排精细、高级且有表现力的纯动效演示动画，观看顺序、内容与运动按理解需要组织。普通讲解可组合Three.js、SVG、HTML/CSS、Canvas、GSAP及组件，主体与环境可代码绘制或沿原图片入口制作，解释制度、关系、原理、过程、比较与计算；按需运用镜头与窗口，在同章切换表示。地图定位、地理空间与军事推演沿本包空间方法，以有据地理与DEM数据构成可展开、缩放和移位的浅纸地图窗口，与普通图解穿插；需其它投影的宏观总览可用SVG，具体操作与局部地貌可沿图片入口制作，支持旁图弹窗。有行动时保留必要部署、行动、应对与结果，静态关系按位置与条件解释。",
    "rejectWhen": "讲解收益不明确，或只是介绍对象、罗列信息、素材难找、文字数字多、能画图、调节节奏或泛称更直观时不选。事实、现有能力与真实时窗须支持实际讲法；确有输入或能力缺口时按原入口处理，不补造。首个讲解段前须有全画幅上下文。不按地图等题材或有无多步动画判断；单幅比较图解也可成立。"
  },
