{
  "kind": "template",
  "id": "fullframe-narrative",
  "catalog": {
    "displayName": {
      "en": "Full-Frame Narrative Template",
      "zh": "全画幅叙事模板"
    },
    "purpose": "正文默认模板。根据口播含义自由创作完整画面，构图、景别与近远层次服务当前观看。单A或A/B由作者按表达与真实阅读窗口选择；方向、运动方式与速度变化在同一创作中确定，全程持续运动。",
    "rejectWhen": "Visual Director按direct-episode的章节划分方法选定该连续范围为讲解章节（含空间与军事推演）时不用本模板。程序提供单A及技术可行的A/B选项，作者按场面方法的逐图清晰观看下限选择；窗口不足时合并画面或返回Director调整Beat，不因此改用讲解。没有走完几何终点本身不构成拒绝；实际取景与速度安排必须兑现观看任务；行程不足自行调整构图、取景与路线，不能停镜。"
  },
