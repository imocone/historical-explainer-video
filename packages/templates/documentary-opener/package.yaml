{
  "kind": "template",
  "id": "documentary-opener",
  "catalog": {
    "displayName": {
      "en": "Documentary Memory Opener",
      "zh": "回忆画流片头"
    },
    "purpose": "从本集P3图纸选择五张回忆画面，并依据节目正式世界设定为每期自由设计一张不同位置、角度和构图的鸟瞰全景由当前作者生成实图；10.5秒无旁白居中呈现明确原典名并单次溶换至本集标题并经呼吸黑场进入正文，配原创钢琴主题",
    "rejectWhen": "正文不足五张不同的完整场景，或本期鸟瞰全景缺少节目设定与本集来源支持"
  },
  "implements": [
    {
      "moduleId": "author-documentary-narration",
      "slotId": "opener-copy-template",
      "majorVersion": 1
    },
    {
      "moduleId": "author-narration",
      "slotId": "opener-copy-template",
      "majorVersion": 1
    },
    {
      "moduleId": "author-bookend",
