interface:
  display_name: "整集视觉导演"
  short_description: "先划讲解章节及全画幅章节，沿原方法切Beat，一次审修两层后交接"
  default_prompt: "Use $direct-episode to establish the whole-album direction, select explainer chapters by the existing method, and organize the remaining continuous fullframe content into chapters that each form a relatively complete narrative unit. Use the existing templateRun (TR) as the chapter identity. Split only fullframe chapters into Beats by the unchanged independent-viewing-progression method. Explainer chapters have no internal Director Beats: hand each new chapter over through one whole-range B record, leaving its pictures, parts and Cue timing to the selected author. Run authorability planning, review chapter boundaries and Beat boundaries in one pass, correct once, seal the same candidate, and submit the complete episode plan for independent Accept recomputation. Body work is then assigned, submitted, accepted and counted by chapter; fullframe Beat results remain independent."
